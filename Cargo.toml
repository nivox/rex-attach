[package]
name = "rex-attach"
version = "0.1.6-dev"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
fontdue = "0.9"
fontdb = "0.23"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
ghostty-vt = { version = "=0.8.0", default-features = false, features = ["kitty-graphics"] }
ghostty-vt-sys = { version = "=0.8.0", features = ["pkg-config"] }
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
